<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>نتيجة الفحص - Link Checker</title>
</head>
<body class="body">
    <div class="header"> 
        <h1>Link Checker</h1>
        <div class="links">
            <a href="index.html">الرئيسية</a>
            <a href="about.html">من نحن</a>
        </div>
    </div>

    <div class="landing-page">
        <div class="landing-page-left-section" style="width: 100%;">
            <h1>🔍 نتيجة فحص الرابط</h1>
            
            <div id="result-container" class="result-container">
                <!-- النتائج  بالجافا -->
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html" class="btn" style="text-decoration: none; margin: 10px;">فحص رابط آخر</a>
                <button onclick="window.print()" class="btn" style="background: #6c757d;">🖨️ طباعة التقرير</button>
            </div>
        </div>
    </div>

    <script>
        
        function scanURL(url) {
            const result = {
                url: url,
                safe: true,
                risk_level: 'low',
                risk_score: 0,
                warnings: [],
                details: []
            };

            try {
                const parsedUrl = new URL(url);
                const hostname = parsedUrl.hostname.toLowerCase();

                
                if(parsedUrl.protocol !== 'https:') {
                    result.warnings.push("⚠️ يفضل استخدام HTTPS للأمان");
                    result.risk_score += 10;
                }

                
                const maliciousPatterns = [
                    'test-malicious',
                    'phishing-test', 
                    'fake-login',
                    'malware-test',
                    'suspicious-domain',
                    'very-long-link',
                    'phishing-site',
                    'bad-domain'
                ];

                const suspiciousPatterns = [
                    'http-example',
                    'unsecure-site',
                    'dangerous-link'
                ];

                
                maliciousPatterns.forEach(pattern => {
                    if (hostname.includes(pattern) || url.includes(pattern)) {
                        result.warnings.push("🚨 تم اكتشاف نمط مشبوه: " + pattern);
                        result.risk_score += 30;
                    }
                });

                
                suspiciousPatterns.forEach(pattern => {
                    if (hostname.includes(pattern) || url.includes(pattern)) {
                        result.warnings.push("⚠️ نمط مشبوه: " + pattern);
                        result.risk_score += 15;
                    }
                });

                
                if(url.length > 80) {
                    result.warnings.push("📏 الرابط طويل جداً - قد يكون خطيراً");
                    result.risk_score += 8;
                }

                
                const dotCount = (hostname.match(/\./g) || []).length;
                if(dotCount > 3) {
                    result.warnings.push("🔍 عدد النقاط في النطاق مريب");
                    result.risk_score += 5;
                }

                
                if(/[<>{}]/.test(url)) {
                    result.warnings.push("⚡ الرابط يحتوي على أحرف خطيرة");
                    result.risk_score += 12;
                }

            } catch {
                result.warnings.push("❌ رابط غير صحيح");
                result.risk_level = 'high';
                result.risk_score = 40;
                result.safe = false;
                return result;
            }

            // تحديد مستوى الخطورة النهائي
            if(result.risk_score >= 30) {
                result.risk_level = 'high';
                result.safe = false;
            } else if(result.risk_score >= 15) {
                result.risk_level = 'medium';
                result.safe = false;
            } else {
                result.risk_level = 'low';
                result.safe = true;
                result.details.push("✅ جميع الفحوصات سليمة");
            }

            result.details.push("📊 درجة الخطورة: " + result.risk_score + "/100");

            return result;
        }

        // عرض النتائج
        function displayResult(result) {
            const container = document.getElementById('result-container');
            
            let html = `
                <div class="result-header">
                    <h3>📎 الرابط: ${result.url}</h3>
                    <span class="risk-badge risk-${result.risk_level}">
                        مستوى الخطورة: ${result.risk_level}
                    </span>
                </div>
                
                <div class="result-status status-${result.safe ? 'safe' : (result.risk_level === 'medium' ? 'suspicious' : 'danger')}">
                    ${result.safe ? '✅ <strong>الرابط آمن</strong>' : 
                      (result.risk_level === 'medium' ? '⚠️ <strong>الرابط مشبوه</strong>' : '🚨 <strong>الرابط خطير</strong>')}
                </div>`;

            if(result.warnings.length > 0) {
                html += `<div class="warning-section">
                    <h4>📢 التحذيرات:</h4>
                    ${result.warnings.map(warning => `<div class="warning-item">${warning}</div>`).join('')}
                </div>`;
            }

            if(result.details.length > 0) {
                html += `<div class="details-section">
                    <h4>📋 التفاصيل:</h4>
                    ${result.details.map(detail => `<div class="detail-item">${detail}</div>`).join('')}
                </div>`;
            }

            
            const isSafe = result.risk_score < 15;
            
            html += `
                <div class="api-results">
                    <h4>🌐 نتائج الفحص المتقدم:</h4>
                    <div class="api-result">
                        <strong>Google Safe Browsing:</strong>
                        <span style="color: ${isSafe ? '#28a745' : '#dc3545'};">${isSafe ? '✅ آمن' : '⛔ خطير'}</span>
                    </div>
                    <div class="api-result">
                        <strong>VirusTotal Scan:</strong>
                        <span style="color: ${isSafe ? '#28a745' : '#dc3545'};">${isSafe ? '0/70' : Math.min(70, result.risk_score) + '/70'} خبيث</span>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // معالجة الرابط من الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const url = urlParams.get('url');
        
        if(url) {
            const result = scanURL(url);
            console.log("نتيجة الفحص:", result); 
            displayResult(result);
        } else {
            document.getElementById('result-container').innerHTML = `
                <p>لم يتم إدخال رابط للفحص.</p>
                <a href="index.html" class="btn" style="text-decoration: none;">العودة للصفحة الرئيسية</a>
            `;
        }
    </script>
</body>
</html>
